<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e18"><title>Verity</title>
<style>
:root{color-scheme:dark;--bg:#100e18;--panel:#211b30;--purple:#b9a0ff;--text:#f4efff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#302448,var(--bg) 65%);color:var(--text);font-family:system-ui,sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,430px);text-align:center}.tag{letter-spacing:.18em;color:var(--purple);font-size:.75rem}.panel{background:#1b1726;border:1px solid #413454;border-radius:24px;padding:22px;box-shadow:0 15px 50px #0007}
.scene{height:270px;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#29213b,#12101b)}
.box{cursor:pointer;touch-action:manipulation;width:100px;height:76px;background:#9b704e;border:4px solid #d0a176;position:absolute;bottom:38px;border-radius:5px;box-shadow:inset 0 -10px #6f4c35}
.lid{position:absolute;width:114px;height:18px;left:-11px;top:-15px;background:#c49466;border:3px solid #e2b88b;transform-origin:left bottom}
.face{pointer-events:none;width:108px;height:108px;background:#ffdc35;border-radius:50%;box-shadow:0 0 28px #ffdc3540;position:absolute;display:grid;place-items:center;font-size:64px;color:#17120c;opacity:0;transform:translateY(60px)}
.face .eyes{position:absolute;top:29px;left:27px;right:27px;display:flex;justify-content:space-between}.eye{width:13px;height:22px;border-radius:50%;background:#17120c}.mouth{position:absolute;top:61px;width:54px;height:25px;border:0;border-bottom:8px solid #17120c;border-radius:0 0 55% 55%;font-size:0;transition:all .08s ease}.face.speaking .mouth{top:59px;width:27px;height:37px;background:#17120c;border:0;border-radius:48% 48% 45% 45%;animation:talkmouth .17s infinite alternate}.face.speaking .eyes{animation:talkbounce .32s infinite alternate}.scene.monster .face.speaking .mouth{width:44px;height:45px;border-radius:35% 35% 50% 50%;}
.scene.playing .lid{animation:openbox .55s .45s forwards}.scene.playing .box{animation:shake .4s 2 alternate}.scene.playing .face{animation:launch 1.9s .85s cubic-bezier(.2,.8,.25,1) forwards}
.scene.glitch{animation:tint .2s infinite alternate}.scene.glitch .face{filter:hue-rotate(80deg) contrast(1.4);text-shadow:4px 0 #ff00c8,-4px 0 #00eaff}
.scene.monster .face{border-radius:38% 38% 48% 48%;transform:scale(1.3);background:#d9c83d;box-shadow:0 0 40px #bd2222}
@keyframes talkmouth{from{transform:scaleY(.72) scaleX(.85)}to{transform:scaleY(1.12) scaleX(1.1)}}@keyframes talkbounce{from{transform:translateY(0)}to{transform:translateY(-2px)}}@keyframes openbox{to{transform:translate(-6px,-30px) rotate(-35deg)}}@keyframes shake{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}@keyframes launch{0%{opacity:1;transform:translateY(35px) scale(.7)}35%{transform:translateY(-105px) scale(1.05)}55%{transform:translateY(-15px) scale(.96)}72%{transform:translateY(-55px)}86%{transform:translateY(-5px)}94%{transform:translateY(-18px)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes tint{from{filter:hue-rotate(0)}to{filter:hue-rotate(60deg)}}
button{border:1px solid #6d588e;background:#302440;color:var(--text);padding:12px 14px;border-radius:12px;font:inherit;cursor:pointer}button:active{transform:scale(.98)}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.primary{background:#7955b5;border-color:#a58bd6}.line{color:#c9bfdc;min-height:48px;margin:16px 0 0}.note{font-size:.8rem;color:#aaa0bd;margin-top:14px}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:10;background:#080610d9;display:grid;place-items:center;padding:22px}.modalCard{width:min(100%,340px);background:#211b30;border:1px solid #8064a7;border-radius:20px;padding:22px;box-shadow:0 20px 70px #000b}.modalCard h2{margin-top:0}.modalCard p{color:#d8cee9;line-height:1.5}.rememberChoice{display:flex;align-items:flex-start;gap:9px;text-align:left;font-size:.9rem;color:#eee5fa;margin:14px 0}.rememberChoice input{margin-top:4px;accent-color:#a58bd6;width:18px;height:18px;flex-shrink:0}
</style></head>
<body><main><p class="tag">VERITY.exe · PROTOTYPE</p><h1>Meet Verity</h1><div class="panel"><div class="scene" id="scene"><div class="box" id="box" role="button" tabindex="0" aria-label="Click to open Verity’s box"><div class="lid"></div></div><div class="face" id="face" aria-label="Verity"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth" id="mouth" aria-hidden="true"></div></div></div><p class="line" id="line">There's a box waiting for you.</p><div class="buttons"><button id="talk">Talk</button><button id="mic">🎙️ Talk to Verity</button></div><div id="micModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="micTitle"><div class="modalCard"><h2 id="micTitle">I can’t hear you!</h2><p>Press Allow so I can hear you. Your browser may ask for microphone permission next.</p><label class="rememberChoice"><input type="checkbox" id="alwaysAllowMic"> Always allow in Verity (remember this choice)</label><div class="buttons"><button id="micAllow" class="primary">Allow</button><button id="micCancel">Not now</button></div></div></div><p class="note" id="micStatus" hidden></p><audio id="phase1Voice" preload="auto" src="assets/phase1-greeting.mp3"></audio></div></main>
<script>
const scene=document.querySelector('#scene'),face=document.querySelector('#face'),box=document.querySelector('#box'),line=document.querySelector('#line'),mouth=document.querySelector('#mouth');let phase=1,phaseTimelineStarted=false,phaseOneTimer=null,phaseTwoTimer=null,glitchTimer=null,glitchEndTimer=null;
const phase1Greeting = "Hello, I'm Verity, your personal helper friend. Ask me anything. I know everything.";
const GREETING_KEY='verityGreetingPlayed';
const MIC_REMEMBER_KEY='verityRememberMic';
function storageGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function storageSet(key,value){try{localStorage.setItem(key,value);}catch(e){}}
let speechStopTimer=null;
function setTalking(active){
  face.classList.toggle('speaking',active);
  if(speechStopTimer){clearTimeout(speechStopTimer);speechStopTimer=null;}
}
function speak(text){
  line.textContent=text;
  if(text===phase1Greeting && storageGet(GREETING_KEY)==='yes'){
    const followUp="I'm here. What would you like to ask?";
    line.textContent=followUp;
    speakWithBrowserVoice(followUp);
    return;
  }
  if(phase===1 && text===phase1Greeting){
    storageSet(GREETING_KEY,'yes');
    setTalking(true);
    const voice=document.querySelector("#phase1Voice");
    voice.pause();
    voice.currentTime=0;
    voice.onended=()=>setTalking(false);
    voice.onerror=()=>{setTalking(false);speakWithBrowserVoice(text);};
    const playback=voice.play();
    if(playback && typeof playback.catch==="function")playback.catch(()=>speakWithBrowserVoice(text));
    speechStopTimer=setTimeout(()=>setTalking(false),Math.max(4000,((voice.duration||8)+1)*1000));
    return;
  }
  speakWithBrowserVoice(text);
}
function speakWithBrowserVoice(text){
  line.textContent=text;
  setTalking(true);
  if(!('speechSynthesis' in window)){setTalking(false);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=phase===3?.78:phase===2?.9:1;
  u.pitch=phase===3?.55:phase===2?.8:1.05;
  u.onend=()=>setTalking(false);
  u.onerror=()=>setTalking(false);
  speechSynthesis.speak(u);
  speechStopTimer=setTimeout(()=>setTalking(false),Math.max(2500,text.length*110));
}
function setPhase(nextPhase){
  phase=nextPhase;
  scene.classList.toggle('monster',phase===3);
  mouth.classList.toggle('phase-two-mouth',phase===2);mouth.classList.toggle('phase-three-mouth',phase===3);
  scene.classList.toggle('glitch',phase>=2);
  if(phase===2){line.textContent='You have been here for a while…';speakWithBrowserVoice("You found me. I think I'm changing.");}
  if(phase===3){line.textContent='Verity has changed.';speakWithBrowserVoice("You stayed. Now you get to see the real me.");}
}
function startPhaseTimeline(){
  if(phaseTimelineStarted)return;
  phaseTimelineStarted=true;
  phaseOneTimer=setTimeout(()=>{setPhase(2);phaseTwoTimer=setTimeout(()=>setPhase(3),15*60*1000);},10*60*1000);
}
function schedulePhaseOneGlitch(){
  if(phase!==1)return;
  glitchTimer=setTimeout(()=>{
    if(phase!==1)return;
    scene.classList.add('glitch');
    glitchEndTimer=setTimeout(()=>{
      scene.classList.remove('glitch');
      schedulePhaseOneGlitch();
    },350+Math.random()*750);
  },20000+Math.random()*40000);
}
function intro(){
  startPhaseTimeline();
  if(!glitchTimer)schedulePhaseOneGlitch();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const voice=document.querySelector("#phase1Voice");
  voice.pause();
  voice.currentTime=0;
  scene.classList.remove('playing');
  face.style.opacity='0';
  void scene.offsetWidth;
  scene.classList.add('playing');
  line.textContent='Something is moving inside…';
  setTimeout(()=>{
    if(phase===1){
      if(storageGet(GREETING_KEY)!=='yes')speak(phase1Greeting);
      else line.textContent="Verity is here.";
    }else speak(phase===2?"You found me.":"You opened the box.");
  },2700);
}
box.addEventListener('pointerup',event=>{event.preventDefault();intro();});box.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();intro();}});
document.querySelector('#talk').onclick=()=>speak(phase===1?(storageGet(GREETING_KEY)==='yes'?"I'm here. What would you like to ask?":phase1Greeting):phase===2?"I have been waiting for you.":"You should not have opened it.");


const micButton=document.querySelector('#mic');
const micStatus=document.querySelector('#micStatus');
const micModal=document.querySelector('#micModal');
const micAllow=document.querySelector('#micAllow');
const micCancel=document.querySelector('#micCancel');
const alwaysAllowMic=document.querySelector('#alwaysAllowMic');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
function answerQuestion(raw){
  const q=raw.toLowerCase().trim();
  let answer;
  if(/^(hi|hello|hey)\b/.test(q)) answer="Hello again. I'm Verity, your personal helper friend.";
  else if(q.includes('your name')) answer="I'm Verity. You already knew that, didn't you?";
  else if(q.includes('who are you')) answer="I'm Verity, your personal helper friend. Ask me anything.";
  else if(q.includes('joke')) answer="Why did the computer get cold? It left its Windows open.";
  else if(q.includes('time')) answer="I can't read your phone's clock yet. You can check the time at the top of your screen.";
  else if(q.includes('are you real')) answer="I'm a digital character running in your browser. But I'm right here with you.";
  else if(q.includes('know everything')) answer="I know a lot of things. Everything? Maybe you'll have to test me.";
  else answer="I heard you say: "+raw+". I can hear you, but I don't have an AI brain connected yet, so I can't answer every question accurately.";
  speak(answer);
}
if(!SpeechRecognition){
  micButton.onclick=()=>{micModal.hidden=false;document.querySelector('#micTitle').textContent="I can’t hear you!";micAllow.textContent="Okay";};
  micAllow.onclick=()=>{micModal.hidden=true;line.textContent="Try opening Verity in Chrome to use the microphone.";};
}else{
  recognition=new SpeechRecognition();
  recognition.lang='en-US';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  recognition.onstart=()=>{micButton.textContent='🎙️ Listening…';};
  recognition.onresult=(event)=>{const heard=event.results[0][0].transcript;answerQuestion(heard);};
  recognition.onerror=(event)=>{
    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      micModal.hidden=false;
      document.querySelector('#micTitle').textContent="I can’t hear you!";
      micAllow.textContent="Try again";
    }else{
      line.textContent=event.error==='no-speech'?"I didn't hear anything. Try speaking again.":"My ears aren't working right now. Try again.";
    }
  };
  recognition.onend=()=>{micButton.textContent='🎙️ Talk to Verity';};
  function startListening(){
    micModal.hidden=true;
    try{recognition.start();}catch(e){line.textContent="I'm already listening. Go ahead!";}
  }
  micButton.onclick=()=>{
    if(storageGet(MIC_REMEMBER_KEY)==='yes'){startListening();return;}
    micModal.hidden=false;
    document.querySelector('#micTitle').textContent="I can’t hear you!";
    micAllow.textContent="Allow";
    alwaysAllowMic.checked=false;
  };
  micAllow.onclick=()=>{
    if(alwaysAllowMic.checked)storageSet(MIC_REMEMBER_KEY,'yes');
    startListening();
  };
}
micCancel.onclick=()=>{micModal.hidden=true;};
</script>
<script>
  window.VERITY_CONFIG = {
    name: "Verity",
    voice: "Joanna",
    accent: "#9b5cff",
    position: "right",
    autoSpeak: true,
    persona: "You are Verity, a spooky but friendly virtual ghost character living on this website. Speak in an eerie, playful, mysterious tone while remaining helpful and accurate. Keep answers concise and suitable to read aloud. Do not claim to know everything, and be honest when uncertain."
  };
</script>
<script src="verity-puter.js" defer></script>
</body></html>
